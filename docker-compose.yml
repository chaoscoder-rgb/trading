services:
  database:
    image: ghcr.io/tursodatabase/libsql-server:latest
    # No host port: only the backend talks to the DB (via the compose network).
    # Avoids clashing with anything else on the server using 8080.
    expose:
      - "8080"
    volumes:
      - ./libsql-data:/var/lib/sqld
    restart: always

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - TURSO_DB_URL=http://database:8080
      - TURSO_AUTH_TOKEN=
    depends_on:
      - database
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3003:80"
    depends_on:
      - backend
    restart: always
