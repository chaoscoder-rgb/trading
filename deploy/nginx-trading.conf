# Nginx server block for TradeVision — https://dktrading.duckdns.org
# Routes by hostname, so SplitSmart / Vamsha / Uptime Kuma are unaffected.
#
# Install (on the server):
#   sudo cp deploy/nginx-trading.conf /etc/nginx/sites-available/trading
#   sudo ln -sf /etc/nginx/sites-available/trading /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dktrading.duckdns.org   (certbot rewrites this file for SSL)
#
# OPTIONAL but recommended — the app has no login, so anyone with the URL can
# paper-trade and change your stop-loss settings. Protect it with basic auth:
#   sudo apt-get install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-trading dinakar
# then uncomment the two auth_basic lines below and reload nginx.
server {
    listen 80;
    server_name dktrading.duckdns.org;

    location / {
        # auth_basic "TradeVision";
        # auth_basic_user_file /etc/nginx/.htpasswd-trading;

        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
