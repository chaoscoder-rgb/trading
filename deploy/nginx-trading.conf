# Nginx server block for TradeVision on dina-server (OPTIONAL — for public access)
# LAN-only use doesn't need this: http://192.168.1.18:3003
#
# Install:  sudo cp deploy/nginx-trading.conf /etc/nginx/sites-available/trading
#           # first edit server_name below to your real (duckdns) domain
#           sudo ln -sf /etc/nginx/sites-available/trading /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d trading.duckdns.org   (certbot rewrites this file for SSL)
server {
    listen 80;
    server_name trading.duckdns.org;   # <-- change to your domain

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
